# One Blueprint, two services: the secure API and the static frontend.
#
# Render assigns both public URLs at creation and wires them to each other with
# `fromService` + `envVarKey: RENDER_EXTERNAL_URL`, which removes the manual
# chicken-and-egg of needing each URL before the other exists. Neither
# *.onrender.com hostname is written here.
#
# `property:` is NOT used for this. It exposes `host` / `hostport`, which are
# private-network addresses — unreachable from a browser and useless as a CORS
# origin. `envVarKey` reads the service's own RENDER_EXTERNAL_URL, which is the
# public https:// URL.
#
# No database is declared: Postgres is Neon. No migration runs on deploy — a
# deploy that silently alters a schema is how a production database gets changed
# by accident. Apply db/migrations from a controlled machine using
# MIGRATION_DATABASE_URL (direct, unpooled). See ENVIRONMENT.md.
#
# No secret appears in this file. `sync: false` declares a variable without a
# value so Render prompts at import; the value is entered in the dashboard.
services:
  # ── Secure API ─────────────────────────────────────────────────────────────
  # `server/render.js` — a thin Node bridge around the Fetch-style handler in
  # server/index.js. DATABASE_URL and ADMIN_USERS_JSON live here and nowhere
  # else; the static site ships every one of its variables to the browser, so a
  # secret there is a published secret.
  - type: web
    name: motion-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:api
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production

      # SECRET. Neon pooled runtime URI. sslmode=require. Never in the frontend
      # service, never in a VITE_ variable, never in Git.
      - key: DATABASE_URL
        sync: false

      # SECRET. JSON array of administrators with scrypt password hashes.
      # Generate hashes with `node scripts/hash-admin-password.js`. Never
      # paste plaintext passwords into Render.
      - key: ADMIN_USERS_JSON
        sync: false

      # Administrator session lifetime in hours. Default 8 if unset.
      - key: ADMIN_SESSION_HOURS
        value: "8"

      # CORS, sourced from the frontend so the allowed origin is exactly the
      # deployed site with no hostname written down. RENDER_EXTERNAL_URL is
      # already a full https:// origin, which is what the check compares against.
      - key: API_ALLOWED_ORIGINS
        fromService:
          name: motion-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      # Rate-limit identity. `none` is a decision on the record, not an omission.
      #
      # Render APPENDS to X-Forwarded-For rather than replacing it, so its first
      # value is supplied by the caller. Naming it here would be worse than
      # naming nothing: every anonymous caller would pick their own bucket while
      # the configuration read as though limiting were enforced.
      #
      # Effect: authenticated callers are limited per session; anonymous callers
      # are not limited by this service. Trade-off in DEPLOYMENT.md.
      - key: API_TRUSTED_CLIENT_HEADER
        value: none

      - key: API_REQUEST_TIMEOUT_MS
        value: "10000"
      - key: API_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: API_RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: API_RATE_LIMIT_MAX_KEYS
        value: "10000"
      - key: API_ANONYMOUS_MUTATION_MAX
        value: "20"

  # ── Static frontend ────────────────────────────────────────────────────────
  - type: web
    name: motion-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_NAME
        value: Motion

      # Public site origin. Leave blank until the real domain is known; the
      # frontend does not require it to boot.
      - key: VITE_APP_URL
        fromService:
          name: motion-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      # The API's public URL, resolved at Blueprint creation. It arrives as an
      # origin with no path; `src/config/env.js` appends the `/api` prefix the
      # client expects, because render.yaml has no string interpolation and the
      # two cannot be concatenated here.
      - key: VITE_API_BASE_URL
        fromService:
          name: motion-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
