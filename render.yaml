# Render Blueprint: two independent web services from this workspace, one per
# domain. The Blueprint asks only for each site's public address and the other
# site's address (for the cross-links); they stay editable in the dashboard.
#
# Optional settings are added later in each service's Environment tab when the
# owner has them; nothing secret is ever committed. The code works without
# them. See README.md and each app's .env.example:
#   DATABASE_URL                   Neon pooled string, same on both services
#   NEXT_PUBLIC_CONTACT_PHONE / _WHATSAPP / _EMAIL / _ADDRESS / _HOURS
#   NEXT_PUBLIC_CONTACT_MAP_URL    (Motion Imprints only)
#   MOTION_ASSISTANT_API_KEY       live answers from the Ask Motion assistant
#   NOTIFY_WEBHOOK_URL             staff notification for each new request
services:
  - type: web
    name: motion-imprints
    runtime: node
    plan: starter
    # The photo gate fails the deploy while any served photograph still has
    # permission pending (see apps/motion-imprints/scripts/launch-check.mjs).
    buildCommand: npm ci && npm run check:photos -w motion-imprints && npm run build -w motion-imprints
    startCommand: npm exec -w motion-imprints -- next start -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_TECHNOLOGIES_URL
        sync: false
      - key: ALLOW_INDEXING
        value: "false"
      - key: TRUSTED_PROXY_HOPS
        value: "1"

  - type: web
    name: motion-technologies
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build -w motion-technologies
    startCommand: npm exec -w motion-technologies -- next start -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_PARENT_URL
        sync: false
      - key: ALLOW_INDEXING
        value: "false"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
